<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

<title>우리집 독서기록</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #F4F5F2; overscroll-behavior: none; }
  body { font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1B1F1D; -webkit-text-size-adjust: 100%; }
  * { -webkit-tap-highlight-color: transparent; }
  button, input, select { font-family: inherit; }
  #app { min-height: 100%; }
  .boot { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; font-size: 16px; color: #3F4743; text-align: center; line-height: 1.6; }
  .pane { max-width: 480px; margin: 0 auto; padding: 32px 20px; box-sizing: border-box; }
  .pane h1 { font-size: 22px; margin: 0 0 12px; color: #0F5F55; }
  .pane p { font-size: 16px; line-height: 1.65; margin: 0 0 14px; }
  .pane .sub { font-size: 14px; color: #5B6460; }
  .pane input { width: 100%; height: 52px; box-sizing: border-box; border: 1px solid #8A9590; border-radius: 12px; padding: 0 12px; font-size: 15px; margin: 4px 0 12px; }
  .pane button { width: 100%; height: 52px; border: none; border-radius: 12px; background: #0F766E; color: #FFFFFF; font-size: 17px; font-weight: 700; margin-bottom: 10px; }
  .pane button.ghost { background: #FFFFFF; color: #0F5F55; border: 1px solid #B9C4BF; }
  .pane button:disabled { opacity: .6; }
</style>
</head>
<body>
<div id="app"><div class="boot">불러오는 중…</div></div>
